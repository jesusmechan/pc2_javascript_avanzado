<nav class="navbar navbar-expand-lg app-navbar sticky-top">
  <div class="container">
    <a class="brand" routerLink="/">
      <span class="brand-logo"><i class="bi bi-book-half"></i></span>
      <span>Biblio<span class="brand-accent">UTP</span></span>
    </a>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#menuPrincipal"
      aria-controls="menuPrincipal"
      aria-expanded="false"
      aria-label="Mostrar menú"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menuPrincipal">
      <ul class="navbar-nav ms-auto gap-lg-1">
        <li class="nav-item" *ngFor="let e of enlaces">
          <a
            class="nav-link"
            [routerLink]="e.ruta"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: e.exacto }"
          >
            <i class="bi" [ngClass]="e.icono"></i>{{ e.texto }}
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>
