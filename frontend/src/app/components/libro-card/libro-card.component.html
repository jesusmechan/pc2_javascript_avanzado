<article class="card book-card" appResaltar>
  <a class="book-cover d-block" [routerLink]="['/libros', libro.id]" [attr.aria-label]="'Ver ' + libro.titulo">
    <img
      [src]="libro.portada"
      [class.cargada]="portadaCargada"
      [alt]="'Portada de ' + libro.titulo"
      loading="lazy"
      (load)="portadaCargada = usarPortadaPorDefecto($event)"
      (error)="usarPortadaPorDefecto($event)"
    />
    <span class="chip chip-glass">{{ libro.categoria }}</span>
    <span class="chip-stock" [appEstadoStock]="libro.stock">
      {{ libro.stock === 0 ? 'Agotado' : libro.stock + ' disp.' }}
    </span>
  </a>
  <div class="card-body d-flex flex-column p-3">
    <h3 class="book-title"><a [routerLink]="['/libros', libro.id]">{{ libro.titulo }}</a></h3>
    <p class="text-muted small mb-2">{{ libro.autor | titlecase }} · {{ libro.anio }}</p>
    <p class="small text-secondary flex-grow-1 mb-3">{{ libro.descripcion | truncar: 90 }}</p>
    <div class="d-flex align-items-center justify-content-between gap-2">
      <span class="book-price">{{ libro.precio | currency: 'PEN' : 'S/' }}</span>
      <div class="d-flex gap-1">
        <a
          class="btn btn-sm btn-icon btn-ghost"
          [routerLink]="['/libros', libro.id, 'editar']"
          title="Editar"
          aria-label="Editar"
        >
          <i class="bi bi-pencil"></i>
        </a>
        <button
          class="btn btn-sm btn-icon btn-ghost text-danger"
          (click)="eliminar.emit(libro)"
          title="Eliminar"
          aria-label="Eliminar"
        >
          <i class="bi bi-trash"></i>
        </button>
      </div>
    </div>
  </div>
</article>
