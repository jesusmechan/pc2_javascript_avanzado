<div class="card h-100 border-0 shadow-sm" appResaltar>
  <img
    [src]="libro.portada"
    class="card-img-top portada"
    [alt]="'Portada de ' + libro.titulo"
    (error)="imagenPorDefecto($event)"
  />
  <div class="card-body d-flex flex-column">
    <div class="d-flex justify-content-between align-items-start mb-2">
      <span class="badge rounded-pill text-bg-light border">{{ libro.categoria }}</span>
      <span [appEstadoStock]="libro.stock">Stock: {{ libro.stock }}</span>
    </div>
    <h5 class="card-title mb-1">{{ libro.titulo }}</h5>
    <p class="text-muted small mb-2">{{ libro.autor | titlecase }} · {{ libro.anio }}</p>
    <p class="card-text small flex-grow-1">{{ libro.descripcion | truncar: 90 }}</p>
    <p class="fs-5 fw-bold text-primary mb-0">{{ libro.precio | currency: 'PEN' : 'symbol-narrow' }}</p>
  </div>
  <div class="card-footer bg-white border-0 d-flex gap-2 pb-3">
    <a class="btn btn-sm btn-outline-primary flex-grow-1" [routerLink]="['/libros', libro.id]">
      <i class="bi bi-eye"></i> Ver
    </a>
    <a class="btn btn-sm btn-outline-secondary" [routerLink]="['/libros', libro.id, 'editar']" title="Editar">
      <i class="bi bi-pencil"></i>
    </a>
    <button class="btn btn-sm btn-outline-danger" (click)="eliminar.emit(libro)" title="Eliminar">
      <i class="bi bi-trash"></i>
    </button>
  </div>
</div>
